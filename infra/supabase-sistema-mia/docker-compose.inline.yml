  migrar_sh:
    content: |
      #!/usr/bin/env bash
      # migrar.sh — restaura a plataforma MIA, vinda do Supabase da nuvem, nesta instância.
      #
      # Roda dentro do serviço `migrador` (docker-compose.yml desta pasta), na VPS,
      # pela rede interna: nenhuma porta do banco novo fica aberta para a internet.
      #
      # DE ONDE VÊM OS DADOS: de arquivos num balde PRIVADO deste mesmo Supabase
      # (`migracao-da-nuvem`), subidos de fora por quem tem acesso de leitura à nuvem
      # (preparar-migracao.sh). A senha do banco da nuvem NUNCA entra neste serviço:
      # levar credencial de um sistema para a configuração de outro é vazamento.
      #
      #   app.dir.tar           pg_dump -Fd -n public -n private num tar (com donos e GRANTs:
      #                         as políticas e GRANTs do anon/authenticated são o
      #                         isolamento entre empresas)
      #   auth_users.json       json_agg(auth.users) — com o hash da senha: ninguém troca
      #   auth_identities.json  json_agg(auth.identities)   de senha. Sessões NÃO vêm: a
      #                         chave JWT é nova, todo mundo entra de novo uma vez.
      #   storage_buckets.json  json_agg(storage.buckets) — mesmas regras de balde
      #   nuvem.txt             contagem linha a linha na nuvem, para a prova final
      #
      # O resto — políticas do Storage, gatilhos em auth, publicação do realtime — é
      # recriado pelo bootstrap do `deskcomm` a cada deploy (ele reaplica o baseline
      # inteiro). Os ARQUIVOS do Storage vão pela API (copiar-storage.mjs).
      #
      # A ORDEM IMPORTA: login antes do app. As FKs do app apontam para auth.users e o
      # pg_restore valida cada uma ao criá-la.
      #
      # IDEMPOTÊNCIA: se o `public` deste banco já tem tabela, a migração já rodou
      # neste volume e o script sai sem tocar em nada. Para refazer, troque o volume
      # (MIA_VOLUME_SUFIXO) — nunca apague dados por aqui.

      set -uo pipefail

      log() { printf '[migrador %s] %s\n' "$$(date -u +%H:%M:%S)" "$$*"; }
      falha() { log "FALHOU: $$*"; exit 1; }
      # Nada que o script imprime pode carregar URL com senha.
      sem_segredo() { sed -E 's#postgres(ql)?://[^ ]*#<url>#g'; }

      MODO="$${MIGRAR:-off}"
      if [ "$$MODO" = "off" ]; then
        log "desligado (MIGRAR=off) — nada a fazer"
        exit 0
      fi
      [ -n "$${SERVICE_ROLE_KEY:-}" ] || falha "SERVICE_ROLE_KEY vazio"

      ALVO="postgresql://supabase_admin:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:$${POSTGRES_PORT}/$${POSTGRES_DB}"
      export PGCONNECT_TIMEOUT=20
      TMP=/tmp/migracao
      BALDE="migracao-da-nuvem"
      mkdir -p "$$TMP"
      log "modo: $$MODO"

      # ── 0. Os serviços criaram os schemas deles? ─────────────────────────────────
      # GoTrue e storage-api migram os próprios schemas ao subir; "saudável" não
      # garante que a última migration acabou. Conferir a tabela garante.
      pronto=0
      for _ in $$(seq 1 60); do
        pronto="$$(psql "$$ALVO" -tAc "select (to_regclass('auth.users') is not null
                                         and to_regclass('auth.identities') is not null
                                         and to_regclass('storage.buckets') is not null)::int" 2>/dev/null || echo 0)"
        [ "$$pronto" = "1" ] && break
        sleep 5
      done
      [ "$$pronto" = "1" ] || falha "auth/storage não criaram os schemas em 5 min"
      sleep 15

      # ── 1. Idempotência ──────────────────────────────────────────────────────────
      ja="$$(psql "$$ALVO" -tAc "select count(*) from information_schema.tables where table_schema = 'public'")"
      if [ "$${ja:-0}" -gt 0 ]; then
        log "o public deste banco já tem $${ja} tabelas: a migração já rodou neste volume. Nada a fazer."
        exit 0
      fi

      # ── 2. Os arquivos da nuvem, do balde interno ────────────────────────────────
      for a in app.dir.tar auth_users.json auth_identities.json storage_buckets.json nuvem.txt; do
        curl -sf -o "$$TMP/$$a" "http://storage:5000/object/$$BALDE/$$a" \
          -H "Authorization: Bearer $$SERVICE_ROLE_KEY" -H "apikey: $$SERVICE_ROLE_KEY" \
          || falha "não baixei $$a do balde $$BALDE (ele foi subido antes de ligar o migrador?)"
      done
      log "arquivos baixados: $$(du -sh "$$TMP" | cut -f1)"

      # ── 3. Extensões que as tabelas do app usam como TIPO (vector, citext) ──────
      psql "$$ALVO" -v ON_ERROR_STOP=1 -q <<'SQL' || falha "extensões"
      set client_min_messages = warning;
      create extension if not exists vector  with schema public;
      create extension if not exists citext  with schema public;
      create extension if not exists pg_trgm with schema public;
      SQL
      log "extensões ok"

      # ── 4. Login e baldes, por JSON ──────────────────────────────────────────────
      # JSON, e não COPY: o GoTrue da nuvem não tem a mesma versão do daqui, e coluna
      # que só um lado tem quebraria o COPY. Entra a interseção das colunas, menos as
      # geradas (confirmed_at, identities.email).
      copiar_json() { # $$1 = schema.tabela  $$2 = arquivo
        local tabela="$$1" arq="$$TMP/$$2"
        psql "$$ALVO" -v ON_ERROR_STOP=1 -q -v tabela="$$tabela" -v doc="$$(cat "$$arq")" <<'SQL' 2>&1 | sem_segredo
      create temp table _j (tabela text, doc json);
      insert into _j values (:'tabela', :'doc');
      do $$$$
      declare
        alvo text; sch text; tab text; cols text; d json; n int;
      begin
        select _j.tabela, _j.doc into alvo, d from _j;
        sch := split_part(alvo, '.', 1);
        tab := split_part(alvo, '.', 2);
        select string_agg(quote_ident(c.column_name), ',' order by c.ordinal_position) into cols
          from information_schema.columns c
         where c.table_schema = sch and c.table_name = tab and c.is_generated = 'NEVER'
           and exists (select 1 from json_array_elements(d) e where (e::jsonb) ? c.column_name);
        if cols is null then
          raise notice '% : nada para copiar', alvo;
          return;
        end if;
        execute format('insert into %I.%I (%s) select %s from json_populate_recordset(null::%I.%I, $$1) on conflict do nothing',
                       sch, tab, cols, cols, sch, tab) using d;
        get diagnostics n = row_count;
        raise notice '% : % linhas copiadas de %', alvo, n, json_array_length(d);
      end $$$$;
      SQL
      }
      copiar_json auth.users auth_users.json
      copiar_json auth.identities auth_identities.json
      copiar_json storage.buckets storage_buckets.json
      log "login e baldes ok"

      # ── 5. O app: public + private, com donos e permissões ───────────────────────
      tar -C "$$TMP" -xf "$$TMP/app.dir.tar" || falha "tar do dump"
      log "pg_restore do dump da nuvem ($$(du -sh "$$TMP/app.dir" | cut -f1)), 4 conexões…"
      pg_restore -j 4 -d "$$ALVO" "$$TMP/app.dir" > "$$TMP/restore.log" 2>&1
      n_erros="$$(grep -c 'ERROR' "$$TMP/restore.log" || true)"
      log "pg_restore terminou com $${n_erros} erro(s). Por tipo:"
      grep 'ERROR' "$$TMP/restore.log" | sed -E 's/.*ERROR: +//; s/"[^"]*"/"…"/g' | sort | uniq -c | sort -rn | head -25 | sem_segredo

      # ── 6. Os links do Storage apontavam para o domínio da nuvem ────────────────
      # Gatilhos desligados (session_replication_role = replica): reescrever uma URL
      # não é um evento do negócio — sem isto, cada linha tocada dispararia
      # updated_at, auditoria e aviso de webhook.
      if [ -n "$${NUVEM_URL_PUBLICO:-}" ] && [ -n "$${NOVO_URL_PUBLICO:-}" ]; then
        psql "$$ALVO" -q -v velho="$$NUVEM_URL_PUBLICO" -v novo="$$NOVO_URL_PUBLICO" <<'SQL' 2>&1 | sem_segredo
      set session_replication_role = replica;
      create temp table _u (velho text, novo text);
      insert into _u values (:'velho', :'novo');
      do $$$$
      declare r record; v text; nv text; n bigint; total bigint := 0;
      begin
        select velho, novo into v, nv from _u;
        for r in
          select c.table_schema s, c.table_name t, c.column_name col, c.data_type dt
            from information_schema.columns c
            join information_schema.tables tb on tb.table_schema = c.table_schema and tb.table_name = c.table_name
           where c.table_schema in ('public', 'private') and tb.table_type = 'BASE TABLE'
             and c.is_generated = 'NEVER'
             and c.data_type in ('text', 'character varying', 'jsonb', 'json')
        loop
          if r.dt in ('jsonb', 'json') then
            execute format('update %I.%I set %I = replace(%I::text, %L, %L)::%s where %I::text like %L',
                           r.s, r.t, r.col, r.col, v, nv, r.dt, r.col, '%' || v || '%');
          else
            execute format('update %I.%I set %I = replace(%I, %L, %L) where %I like %L',
                           r.s, r.t, r.col, r.col, v, nv, r.col, '%' || v || '%');
          end if;
          get diagnostics n = row_count;
          if n > 0 then
            raise notice 'link reescrito: %.%.% — % linha(s)', r.s, r.t, r.col, n;
            total := total + n;
          end if;
        end loop;
        raise notice 'links reescritos no total: %', total;
      end $$$$;
      SQL
      fi

      # ── 7. A prova: contagem linha a linha, nuvem x aqui ─────────────────────────
      psql "$$ALVO" -tAF'|' -c "
        select table_schema || '.' || table_name,
               (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', table_schema, table_name), false, true, '')))[1]::text
          from information_schema.tables
         where table_schema in ('public', 'private') and table_type = 'BASE TABLE'
         order by 1" > "$$TMP/aqui.txt" 2>&1
      tabelas="$$(wc -l < "$$TMP/nuvem.txt" | tr -d ' ')"
      linhas="$$(awk -F'|' '{s+=$$2} END {print s+0}' "$$TMP/nuvem.txt")"
      if diff -q "$$TMP/nuvem.txt" "$$TMP/aqui.txt" >/dev/null; then
        log "CONTAGEM IGUAL: $${tabelas} tabelas, $${linhas} linhas na nuvem e aqui."
      else
        log "CONTAGEM DIFERENTE (< nuvem | > aqui):"
        diff "$$TMP/nuvem.txt" "$$TMP/aqui.txt" | head -40
      fi
      for t in users identities; do
        a="$$(grep -o '"id"' "$$TMP/auth_$$t.json" | wc -l | tr -d ' ')"
        b="$$(psql "$$ALVO" -tAc "select count(*) from auth.$$t")"
        log "auth.$$t: nuvem $${a} / aqui $${b}"
      done

      log "FIM (modo $${MODO}): erros do pg_restore = $${n_erros}. Próximo passo: arquivos do Storage e deploy do deskcomm."
      exit 0

  fazer_backup_sh:
    content: |
      #!/usr/bin/env bash
      # fazer-backup.sh — a cópia diária do banco e dos arquivos da plataforma MIA.
      #
      # Roda no serviço `backup` (docker-compose.yml da pasta de cima), na VPS, pela
      # rede interna. Uma vez por dia (BACKUP_HORA_UTC, padrão 06 = 03:00 de Brasília)
      # grava uma pasta em /backups (volume mia-backups) com o MESMO formato que o
      # migrador/migrar.sh já restaura — o caminho provado na virada de 29/09/2026:
      #
      #   app.dir.tar            pg_dump -Fd -n public -n private, com donos e GRANTs
      #   auth_users.json        login: usuários (com o hash da senha) e identidades
      #   auth_identities.json
      #   storage_buckets.json   baldes e a lista de objetos do Storage
      #   storage_objects.json
      #   nuvem.txt              contagem linha a linha de cada tabela do app (o nome
      #                          vem do migrador, que compara a ORIGEM com o destino)
      #   storage.tar            os arquivos do Storage (volume mia-storage). O tipo e o
      #                          cache de cada um estão no storage_objects.json: restaurar
      #                          é subir pela API do Storage (ver BACKUP.md), não
      #                          desempacotar no volume.
      #   SHA256SUMS             para conferir a cópia antes de restaurar
      #   relatorio.txt          o resumo legível
      #
      # TUDO DO MESMO INSTANTE: dump, contagem e JSON saem de UM snapshot
      # (pg_export_snapshot). Sem isso, um usuário criado no meio do backup viraria FK
      # quebrada na restauração, e a contagem nunca bateria com o dump.
      #
      # Este script só marca PRONTO. Quem leva para fora da VPS é o `backup-envio`
      # (enviar.sh), que marca ENVIADO. Na VPS ficam as BACKUP_MANTER_LOCAL cópias mais
      # novas já enviadas; as nunca enviadas ficam até 14 dias.
      #
      # ONDE VER SE FUNCIONA: não há log central na VPS, então o log é uma tabela deste
      # mesmo banco: operacao.backup (uma linha por execução, com a etapa em que parou)
      # e operacao.backup_envio (o último relato do envio). O schema `operacao` não é
      # do app: fica fora do dump, da API e das migrations.
      #
      # BACKUP_UMA_VEZ=sim: faz um backup agora e sai (teste e disparo manual).

      set -uo pipefail

      log() { printf '[backup %s] %s\n' "$$(date -u +%FT%TZ)" "$$*"; }
      # Nada que o script imprime ou grava pode carregar URL com senha.
      sem_segredo() { sed -E 's#postgres(ql)?://[^ ]*#<url>#g'; }

      ALVO="postgresql://supabase_admin:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:$${POSTGRES_PORT}/$${POSTGRES_DB}"
      export PGCONNECT_TIMEOUT=20 PGAPPNAME=backup-sistema-mia
      RAIZ=/backups
      STORAGE=/storage
      HORA="$${BACKUP_HORA_UTC:-06}"
      MANTER_LOCAL="$${BACKUP_MANTER_LOCAL:-3}"
      JOBS="$${BACKUP_JOBS:-2}"
      TENTATIVAS_POR_DIA=3
      TEMPO_ENTRE_TENTATIVAS=1800

      sql() { psql "$$ALVO" -X -q -tA -v ON_ERROR_STOP=1 "$$@"; }

      esperar_banco() {
        for _ in $$(seq 1 60); do
          sql -c "select 1" >/dev/null 2>&1 && return 0
          sleep 5
        done
        log "o banco não respondeu em 5 min"
        return 1
      }

      preparar_tabela() {
        sql <<'SQL'
      set client_min_messages = warning;
      create schema if not exists operacao;
      comment on schema operacao is 'Infraestrutura da VPS (backup diário). Não é do app: fica fora do dump do app, da API e das migrations.';
      create table if not exists operacao.backup (
        pasta           text primary key,
        iniciado_em     timestamptz not null default now(),
        terminado_em    timestamptz,
        ok              boolean,
        etapa           text,
        detalhe         text,
        bytes           bigint,
        tabelas         int,
        linhas          bigint,
        usuarios        int,
        objetos_storage int,
        enviado_em      timestamptz,
        envio_detalhe   text
      );
      create table if not exists operacao.backup_envio (
        id       int primary key default 1 check (id = 1),
        visto_em timestamptz not null,
        relato   text
      );
      SQL
      }

      # registrar PASTA OK ETAPA DETALHE [BYTES TABELAS LINHAS USUARIOS OBJETOS]
      # OK vazio = em andamento. Falhar em registrar não derruba o backup.
      registrar() {
        sql -v pasta="$$1" -v ok="$$2" -v etapa="$$3" -v det="$$4" -v bytes="$${5:-}" -v tab="$${6:-}" \
            -v lin="$${7:-}" -v usu="$${8:-}" -v obj="$${9:-}" >/dev/null 2>&1 <<'SQL' || log "AVISO: não consegui registrar em operacao.backup"
      insert into operacao.backup as b (pasta, ok, etapa, detalhe, terminado_em, bytes, tabelas, linhas, usuarios, objetos_storage)
      values (:'pasta', nullif(:'ok', '')::boolean, :'etapa', nullif(:'det', ''),
              case when nullif(:'ok', '') is null then null else now() end,
              nullif(:'bytes', '')::bigint, nullif(:'tab', '')::int, nullif(:'lin', '')::bigint,
              nullif(:'usu', '')::int, nullif(:'obj', '')::int)
      on conflict (pasta) do update
         set ok = excluded.ok, etapa = excluded.etapa, detalhe = excluded.detalhe, terminado_em = excluded.terminado_em,
             bytes = coalesce(excluded.bytes, b.bytes), tabelas = coalesce(excluded.tabelas, b.tabelas),
             linhas = coalesce(excluded.linhas, b.linhas), usuarios = coalesce(excluded.usuarios, b.usuarios),
             objetos_storage = coalesce(excluded.objetos_storage, b.objetos_storage);
      SQL
      }

      # O snapshot vive enquanto esta sessão segura a transação aberta. O id sai por
      # arquivo (\o), não pela saída do psql: saída de programa em pipe fica em buffer.
      SNAP_ARQ=/tmp/snapshot.id
      abrir_snapshot() {
        rm -f "$$SNAP_ARQ"
        coproc SEGURA { psql "$$ALVO" -X -q -tA -v ON_ERROR_STOP=1 > /tmp/snapshot.log 2>&1; }
        printf '%s\n' "begin transaction isolation level repeatable read read only;" \
          "\\o $$SNAP_ARQ" "select pg_export_snapshot();" "\\o" >&"$${SEGURA[1]}"
        for _ in $$(seq 1 60); do
          [ -s "$$SNAP_ARQ" ] && break
          sleep 1
        done
        SNAP="$$(tr -d '[:space:]' < "$$SNAP_ARQ" 2>/dev/null)"
        [[ "$$SNAP" =~ ^[0-9A-F]+-[0-9A-F]+-[0-9]+$$ ]]
      }
      fechar_snapshot() {
        local pid="$${SEGURA_PID:-}"
        if [ -n "$$pid" ] && kill -0 "$$pid" 2>/dev/null; then
          printf 'commit;\n\\q\n' >&"$${SEGURA[1]}" 2>/dev/null || true
        fi
        [ -n "$$pid" ] && wait "$$pid" 2>/dev/null
        unset SEGURA_PID
        rm -f "$$SNAP_ARQ"
      }

      fazer_backup() {
        local pasta="$$1" dir="$$RAIZ/$$1.parcial" inicio t0
        inicio="$$(date -u +%FT%TZ)"
        t0=$$(date +%s)
        rm -rf "$$RAIZ"/*.parcial
        if [ -e "$$RAIZ/$$pasta" ]; then log "a pasta $$pasta já existe; nada a fazer"; return 0; fi
        mkdir -p "$$dir"
        registrar "$$pasta" "" "início" ""
        log "backup $$pasta: começando"

        falhou() { # ETAPA DETALHE
          local det; det="$$(printf '%s' "$$2" | sem_segredo | tr '\n' ' ' | cut -c1-900)"
          log "FALHOU na etapa $$1: $$det"
          registrar "$$pasta" false "$$1" "$$det"
          fechar_snapshot
          rm -rf "$$dir"
          return 1
        }

        abrir_snapshot || { falhou snapshot "sem id de snapshot: $$(sem_segredo < /tmp/snapshot.log | tail -n 3)"; return 1; }

        pg_dump "$$ALVO" --snapshot="$$SNAP" -Fd -j "$$JOBS" -n public -n private -f "$$dir/app.dir" 2> "$$dir/.erro" \
          || { falhou pg_dump "$$(tail -n 3 "$$dir/.erro")"; return 1; }
        pg_restore --list "$$dir/app.dir" > /dev/null 2> "$$dir/.erro" \
          || { falhou "leitura do dump" "$$(tail -n 3 "$$dir/.erro")"; return 1; }
        tar -C "$$dir" -cf "$$dir/app.dir.tar" app.dir 2> "$$dir/.erro" && rm -rf "$$dir/app.dir" \
          || { falhou "tar do dump" "$$(tail -n 3 "$$dir/.erro")"; return 1; }

        # Login, baldes, contagem e resumo no MESMO snapshot do dump.
        sql > /dev/null 2> "$$dir/.erro" <<SQL || { falhou "login, baldes e contagem" "$$(tail -n 3 "$$dir/.erro")"; return 1; }
      set statement_timeout = 0;
      begin transaction isolation level repeatable read read only;
      set transaction snapshot '$$SNAP';
      \o $$dir/auth_users.json
      select coalesce(json_agg(x), '[]'::json) from auth.users x;
      \o $$dir/auth_identities.json
      select coalesce(json_agg(x), '[]'::json) from auth.identities x;
      \o $$dir/storage_buckets.json
      select coalesce(json_agg(x), '[]'::json) from storage.buckets x;
      \o $$dir/storage_objects.json
      select coalesce(json_agg(x), '[]'::json) from storage.objects x;
      \o $$dir/nuvem.txt
      select table_schema || '.' || table_name,
             (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', table_schema, table_name), false, true, '')))[1]::text
        from information_schema.tables
       where table_schema in ('public', 'private') and table_type = 'BASE TABLE'
       order by 1;
      \o $$dir/.resumo
      select concat_ws('|', (select count(*) from auth.users), (select count(*) from auth.identities),
                            (select count(*) from storage.buckets), (select count(*) from storage.objects),
                            pg_database_size(current_database()), split_part(version(), ' on ', 1));
      \o
      commit;
      SQL
        fechar_snapshot

        # O tar desta imagem é o do busybox (sem --xattrs): o que o volume guarda em
        # atributo estendido está também no storage_objects.json.
        [ -d "$$STORAGE" ] || { falhou storage "o volume do Storage não está montado em $$STORAGE"; return 1; }
        tar -C "$$STORAGE" -cf "$$dir/storage.tar" . 2> "$$dir/.erro" && [ -s "$$dir/storage.tar" ] \
          || { falhou storage "$$(tail -n 3 "$$dir/.erro")"; return 1; }

        (cd "$$dir" && sha256sum app.dir.tar auth_users.json auth_identities.json storage_buckets.json \
            storage_objects.json nuvem.txt storage.tar > SHA256SUMS) 2> "$$dir/.erro" \
          || { falhou conferência "$$(tail -n 3 "$$dir/.erro")"; return 1; }

        local usuarios identidades baldes objetos banco_bytes versao tabelas linhas bytes arquivos_storage
        IFS='|' read -r usuarios identidades baldes objetos banco_bytes versao < "$$dir/.resumo"
        tabelas="$$(wc -l < "$$dir/nuvem.txt" | tr -d ' ')"
        linhas="$$(awk -F'|' '{s+=$$2} END {print s+0}' "$$dir/nuvem.txt")"
        arquivos_storage="$$(tar -tf "$$dir/storage.tar" | grep -vc '/$$')"
        rm -f "$$dir/.erro" "$$dir/.resumo"
        bytes="$$(du -sb "$$dir" | cut -f1)"

        cat > "$$dir/relatorio.txt" <<TXT
      Backup da plataforma MIA · $$pasta
      Início $$inicio · fim $$(date -u +%FT%TZ) · $$(( $$(date +%s) - t0 )) s

      Banco: $$versao · $$(( banco_bytes / 1048576 )) MB em disco
      App (public, private): $$tabelas tabelas · $$linhas linhas
      Login: $$usuarios usuários · $$identidades identidades
      Storage: $$baldes baldes · $$objetos objetos no banco · $$arquivos_storage arquivos no volume

      Arquivos:
      $$(cd "$$dir" && stat -c '%n %s' app.dir.tar auth_users.json auth_identities.json storage_buckets.json storage_objects.json nuvem.txt storage.tar \
        | awk '{ if ($$2 < 1048576) printf "  %-22s %8.1f KB\n", $$1, $$2/1024; else printf "  %-22s %8.1f MB\n", $$1, $$2/1048576 }')

      Tudo criptografado no drive (rclone crypt). Como restaurar:
      infra/supabase-sistema-mia/BACKUP.md no repositório gabrielmket/mia.
      TXT

        mv "$$dir" "$$RAIZ/$$pasta" && touch "$$RAIZ/$$pasta/PRONTO" \
          || { falhou "fechar a pasta" "mv falhou"; return 1; }
        registrar "$$pasta" true fim "pronto em $$(( $$(date +%s) - t0 )) s" \
          "$$bytes" "$$tabelas" "$$linhas" "$$usuarios" "$$objetos"
        log "backup $$pasta: pronto ($$(( bytes / 1048576 )) MB, $$tabelas tabelas, $$linhas linhas, $$objetos objetos)"
      }

      # Leva para a tabela o que o backup-envio deixou no volume.
      sincronizar_envio() {
        local d
        for d in "$$RAIZ"/20*/; do
          d="$${d%/}"
          [ -f "$$d/ENVIADO" ] && [ ! -f "$$d/.registrado" ] || continue
          sql -v pasta="$$(basename "$$d")" -v quando="$$(head -n 1 "$$d/ENVIADO")" \
              -v det="$$(tail -n +2 "$$d/ENVIADO" | head -c 500)" >/dev/null 2>&1 <<'SQL' && touch "$$d/.registrado"
      update operacao.backup set enviado_em = :'quando'::timestamptz, envio_detalhe = :'det' where pasta = :'pasta';
      SQL
        done
        if [ -f "$$RAIZ/ENVIO-STATUS" ]; then
          sql -v quando="$$(head -n 1 "$$RAIZ/ENVIO-STATUS")" \
              -v rel="$$(tail -n +2 "$$RAIZ/ENVIO-STATUS" | head -c 2000)" >/dev/null 2>&1 <<'SQL' || true
      insert into operacao.backup_envio (id, visto_em, relato) values (1, :'quando'::timestamptz, :'rel')
      on conflict (id) do update set visto_em = excluded.visto_em, relato = excluded.relato;
      SQL
        fi
      }

      limpar_local() {
        local n=0 d
        for d in $$(ls -1d "$$RAIZ"/20*/ 2>/dev/null | sort -r); do
          d="$${d%/}"
          if [ -f "$$d/ENVIADO" ]; then
            n=$$((n + 1))
            if [ "$$n" -gt "$$MANTER_LOCAL" ]; then rm -rf "$$d"; log "apagado da VPS (já está no drive): $$(basename "$$d")"; fi
          elif [ -n "$$(find "$$d" -maxdepth 0 -mtime +14)" ]; then
            rm -rf "$$d"; log "AVISO: apagado sem nunca ter sido enviado (mais de 14 dias): $$(basename "$$d")"
          fi
        done
      }

      # Devido = nunca houve backup, ou já passou do horário de hoje e o último pronto é
      # de antes dele. Falha tenta de novo a cada 30 min, até 3 vezes no dia.
      devido() {
        local agora slot ultimo t
        agora=$$(date -u +%s)
        slot=$$(date -u -d "$$(date -u +%F) $${HORA}:00" +%s)
        ultimo="$$(for d in "$$RAIZ"/20*/; do [ -f "$${d}PRONTO" ] && basename "$$d"; done 2>/dev/null | sort | tail -n 1)"
        if [ -n "$$ultimo" ]; then
          t=$$(date -u -d "$$(sed -E 's/^([0-9-]+)T([0-9]{2})([0-9]{2})Z$$/\1 \2:\3/' <<< "$$ultimo")" +%s 2>/dev/null || echo 0)
          [ "$$agora" -ge "$$slot" ] && [ "$$t" -lt "$$slot" ] || return 1
        fi
        local f="$$RAIZ/.falhas-$$(date -u +%F)"
        if [ -f "$$f" ]; then
          [ "$$(cat "$$f")" -lt "$$TENTATIVAS_POR_DIA" ] || return 1
          [ $$(( agora - $$(stat -c %Y "$$f") )) -ge "$$TEMPO_ENTRE_TENTATIVAS" ] || return 1
        fi
        return 0
      }
      contar_falha() {
        local f="$$RAIZ/.falhas-$$(date -u +%F)"
        echo $$(( $$(cat "$$f" 2>/dev/null || echo 0) + 1 )) > "$$f"
      }

      mkdir -p "$$RAIZ"
      log "no ar: backup diário às $${HORA}:00 UTC; $${MANTER_LOCAL} cópias já enviadas ficam na VPS"
      esperar_banco || exit 1
      preparar_tabela > /dev/null 2>&1 || log "AVISO: não criei operacao.backup (sigo sem registro no banco)"

      if [ "$${BACKUP_UMA_VEZ:-}" = "sim" ]; then
        fazer_backup "$$(date -u +%Y-%m-%dT%H%MZ)"; rc=$$?
        sincronizar_envio
        exit "$$rc"
      fi

      while true; do
        sincronizar_envio
        if devido; then
          if fazer_backup "$$(date -u +%Y-%m-%dT%H%MZ)"; then rm -f "$$RAIZ"/.falhas-*; else contar_falha; fi
          limpar_local
        fi
        sleep 600
      done

  enviar_sh:
    content: |
      #!/bin/sh
      # enviar.sh — leva os backups da VPS para o drive compartilhado do Google.
      #
      # Roda no serviço `backup-envio` (imagem rclone/rclone, Alpine: sh do busybox, sem
      # bash). Lê o volume mia-backups, onde o `backup` (fazer-backup.sh) deixa uma pasta
      # por dia com PRONTO. Para cada pasta pronta e ainda não enviada:
      #
      #   1. copia para  <drive>/backups/<pasta>/  CRIPTOGRAFADO (rclone crypt: o
      #      conteúdo vira .bin ilegível; os nomes ficam legíveis para achar o dia);
      #   2. confere com `rclone cryptcheck` (compara o hash de cada arquivo do drive
      #      com o local, sem baixar nada);
      #   3. só então marca ENVIADO, e sobe o relatorio.txt ABERTO em
      #      <drive>/relatorios/<pasta>.txt (resumo sem dado pessoal, para quem abre o
      #      drive saber o que tem ali).
      #
      # Retenção no drive: BACKUP_MANTER_DIAS (padrão 30). Os 7 backups mais novos
      # nunca são apagados, mesmo velhos: backup que parou não pode levar os últimos
      # junto.
      #
      # A cada volta grava /backups/ENVIO-STATUS (1ª linha: quando; resto: o relato),
      # que o `backup` leva para operacao.backup_envio.
      #
      # Credencial do Google, uma das duas (em base64, porque JSON não cabe no .env):
      #   GOOGLE_DRIVE_TOKEN_B64  token OAuth de um membro do drive, gerado por
      #                           `rclone authorize drive` (o jeito em uso desde 29/09/2026:
      #                           um clique do dono da conta, sem Google Cloud);
      #   GOOGLE_SA_JSON_B64      JSON de uma conta de serviço, membro "Gerente de
      #                           conteúdo" SÓ do drive (menos acesso; exige Google Cloud).
      # O drive é o compartilhado BACKUP_DRIVE_ID. Senha e sal da criptografia:
      # BACKUP_CRIPTO_SENHA / BACKUP_CRIPTO_SAL, já no formato `rclone obscure`. Sem
      # credencial ou sem senha, o serviço fica parado avisando, sem enviar nada.
      #
      # BACKUP_UMA_VEZ=sim: uma volta só e sai. BACKUP_RAIZ_DRIVE troca o destino (o
      # teste usa uma pasta local no lugar do drive).

      set -u
      umask 077

      log() { echo "[envio $$(date -u +%FT%TZ)] $$*"; }
      status() { printf '%s\n%s\n' "$$(date -u +%FT%TZ)" "$$*" > /backups/ENVIO-STATUS; }

      INTERVALO="$${BACKUP_ENVIO_INTERVALO:-600}"
      MANTER_DIAS="$${BACKUP_MANTER_DIAS:-30}"
      MANTER_SEMPRE=7
      RAIZ_DRIVE="$${BACKUP_RAIZ_DRIVE:-gdrive:}"

      if { [ -z "$${GOOGLE_DRIVE_TOKEN_B64:-}" ] && [ -z "$${GOOGLE_SA_JSON_B64:-}" ]; } || [ -z "$${BACKUP_DRIVE_ID:-}" ] \
         || [ -z "$${BACKUP_CRIPTO_SENHA:-}" ] || [ -z "$${BACKUP_CRIPTO_SAL:-}" ]; then
        while true; do
          msg="parado: falta configurar a conta do Google, o drive ou a senha da criptografia. Nada sai da VPS."
          status "$$msg"; log "$$msg"
          [ "$${BACKUP_UMA_VEZ:-}" = "sim" ] && exit 1
          sleep 3600
        done
      fi

      credencial_invalida() {
        status "a credencial do Google ($$1) não é base64 válido"
        log "credencial inválida: $$1"
        sleep 3600
        exit 1
      }

      # Os remotos saem do ambiente. O rclone grava o token renovado no arquivo de
      # configuração: um descartável em /tmp (o token de base continua o do ambiente).
      export RCLONE_CONFIG=/tmp/rclone.conf
      : > "$$RCLONE_CONFIG"
      export RCLONE_CONFIG_GDRIVE_TYPE=drive
      export RCLONE_CONFIG_GDRIVE_SCOPE=drive
      export RCLONE_CONFIG_GDRIVE_TEAM_DRIVE="$$BACKUP_DRIVE_ID"
      if [ -n "$${GOOGLE_DRIVE_TOKEN_B64:-}" ]; then
        RCLONE_CONFIG_GDRIVE_TOKEN="$$(echo "$$GOOGLE_DRIVE_TOKEN_B64" | base64 -d 2> /dev/null)" || credencial_invalida GOOGLE_DRIVE_TOKEN_B64
        [ -n "$$RCLONE_CONFIG_GDRIVE_TOKEN" ] || credencial_invalida GOOGLE_DRIVE_TOKEN_B64
        export RCLONE_CONFIG_GDRIVE_TOKEN
      else
        echo "$$GOOGLE_SA_JSON_B64" | base64 -d > /tmp/conta-google.json 2> /dev/null || credencial_invalida GOOGLE_SA_JSON_B64
        export RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE=/tmp/conta-google.json
      fi
      export RCLONE_CONFIG_COFRE_TYPE=crypt
      export RCLONE_CONFIG_COFRE_REMOTE="$${RAIZ_DRIVE}backups"
      export RCLONE_CONFIG_COFRE_PASSWORD="$$BACKUP_CRIPTO_SENHA"
      export RCLONE_CONFIG_COFRE_PASSWORD2="$$BACKUP_CRIPTO_SAL"
      export RCLONE_CONFIG_COFRE_FILENAME_ENCRYPTION=off
      export RCLONE_CONFIG_COFRE_DIRECTORY_NAME_ENCRYPTION=false
      RELATORIOS="$${RAIZ_DRIVE}relatorios"

      # Marcas do volume (PRONTO, ENVIADO, .registrado) não viajam.
      enviar() { rclone copy "$$1" "cofre:$$2" --exclude PRONTO --exclude ENVIADO --exclude '.*' \
                   --transfers 4 --retries 3 --low-level-retries 10; }
      conferir() { rclone cryptcheck "$$1" "cofre:$$2" --exclude PRONTO --exclude ENVIADO --exclude '.*' --one-way; }

      log "no ar: envio a cada $${INTERVALO}s, $${MANTER_DIAS} dias guardados no drive"

      while true; do
        enviados=0
        erros=""

        for d in $$(ls -1d /backups/20*/ 2> /dev/null | sort); do
          d="$${d%/}"
          nome="$$(basename "$$d")"
          [ -f "$$d/PRONTO" ] || continue
          [ -f "$$d/ENVIADO" ] && continue
          log "enviando $$nome ($$(du -sh "$$d" | cut -f1))…"
          if enviar "$$d" "$$nome" 2> /tmp/erro.txt && conferir "$$d" "$$nome" 2> /tmp/erro.txt; then
            rclone copyto "$$d/relatorio.txt" "$$RELATORIOS/$$nome.txt" 2> /dev/null \
              || log "AVISO: o relatório de $$nome não subiu (o backup subiu)"
            printf '%s\n%s\n' "$$(date -u +%FT%TZ)" "enviado e conferido no drive: $$(du -sh "$$d" | cut -f1)" > "$$d/ENVIADO"
            enviados=$$((enviados + 1))
            log "$$nome enviado e conferido"
          else
            e="$$(grep -E 'ERROR|Failed|NOTICE' /tmp/erro.txt | tail -n 2 | tr '\n' ' ' | cut -c1-400)"
            erros="$$erros $$nome: $${e:-falhou sem mensagem};"
            log "FALHOU $$nome: $$e"
          fi
        done

        # Retenção: só os mais velhos que MANTER_DIAS, e nunca os MANTER_SEMPRE mais novos.
        lista="$$(rclone lsf cofre: --dirs-only 2> /dev/null | sed 's#/$$##' | grep -E '^20[0-9-]+T[0-9]{4}Z$$' | sort)"
        total="$$(printf '%s\n' "$$lista" | grep -c . || true)"
        corte="$$(date -u -d "@$$(( $$(date +%s) - MANTER_DIAS * 86400 ))" +%Y-%m-%dT%H%MZ)"
        apagados=0
        if [ "$$total" -gt "$$MANTER_SEMPRE" ]; then
          for n in $$(printf '%s\n' "$$lista" | head -n $$((total - MANTER_SEMPRE)) | awk -v c="$$corte" '$$0 < c'); do
            if rclone purge "cofre:$$n" 2> /dev/null; then
              rclone deletefile "$$RELATORIOS/$$n.txt" 2> /dev/null || true
              apagados=$$((apagados + 1))
              log "apagado do drive (mais de $${MANTER_DIAS} dias): $$n"
            fi
          done
        fi

        rclone copyto /backup-scripts/LEIA-ME.txt "$${RAIZ_DRIVE}LEIA-ME.txt" 2> /dev/null || true

        # O mais novo nunca é apagado; o total é o que ficou depois da retenção.
        ultimo="$$(printf '%s\n' "$$lista" | tail -n 1)"
        total=$$((total - apagados))
        if [ -z "$$erros" ]; then
          status "ok: $${enviados} enviado(s) nesta volta, $${apagados} apagado(s) por idade; no drive: $${total} backup(s), o mais novo $${ultimo:-nenhum}"
        else
          status "ERRO:$${erros} (no drive: $${total} backup(s), o mais novo $${ultimo:-nenhum})"
        fi

        if [ "$${BACKUP_UMA_VEZ:-}" = "sim" ]; then
          [ -z "$$erros" ]
          exit $$?
        fi
        sleep "$$INTERVALO"
      done

  backup_leia_me:
    content: |
      BACKUP DA PLATAFORMA MIA (crm.timecompany.com.br)

      O que tem aqui
        backups/     uma pasta por dia (ex.: 2026-09-30T0600Z, horário UTC). Dentro,
                     o banco inteiro da plataforma e os arquivos do Storage.
                     Os arquivos terminam em .bin porque estão CRIPTOGRAFADOS: sem a
                     senha, ninguém lê o conteúdo, nem quem tem acesso a este drive.
        relatorios/  um resumo aberto de cada backup (quantas tabelas, linhas,
                     usuários e arquivos). Não tem dado pessoal.

      Quando e por quanto tempo
        Todo dia às 03:00 (Brasília). Ficam 30 dias; os 7 mais novos nunca são
        apagados, mesmo que o backup pare.

      Quem grava
        O servidor da plataforma, com uma autorização da conta
        gabriel@timecompany.com.br (membro deste drive). Se essa conta sair do
        drive ou a autorização for revogada, os backups param de chegar.

      Senha da criptografia
        Guardada no computador da operação, em
        Consultoria/DeskcommCRM-implantacao/ENV-SUPABASE-SISTEMA-MIA.txt
        (BACKUP_CRIPTO_SENHA e BACKUP_CRIPTO_SAL) e no servidor. Guarde também uma
        cópia num cofre de senhas: sem ela, estes arquivos não servem para nada.

      Como restaurar
        Passo a passo em infra/supabase-sistema-mia/BACKUP.md, no repositório
        gabrielmket/mia.

      Não apague nem mova nada aqui dentro à mão.

