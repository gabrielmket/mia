# GERADO por gerar-inline.mjs a partir de docker-compose.yml desta pasta. Não edite à mão.
# ═══════════════════════════════════════════════════════════════════════════
# supabase-sistema-mia — o Supabase PRÓPRIO da plataforma MIA
#
# Serviço `supabase-sistema-mia` do projeto `banco-de-dados` no EasyPanel.
# Nasceu em 28/09/2026, quando o plano grátis do Supabase na nuvem estourou a
# cota de egress e restringiu o projeto (a plataforma ficou fora do ar).
#
# Base: o compose oficial do Supabase self-hosted, na MESMA versão que o
# template do EasyPanel instala (easypanel-io/compose @ 18-05-2026,
# supabase/code), com estas diferenças, cada uma com a sua razão:
#
#   * Postgres 17 (o override oficial docker-compose.pg17.yml). A plataforma
#     roda em 17.6 na nuvem; restaurar um dump do 17 num 15 não é suportado.
#   * `db` e `kong` viram `mia-db` e `mia-kong`. Os dois são os únicos que
#     entram na rede comum do EasyPanel (`easypanel`), onde já vive o Supabase
#     dos clientes do n8n com os MESMOS nomes de serviço. Dois `db` na mesma
#     rede = o DNS responde um OU outro, e um serviço de um lado conecta no
#     banco do outro. Os demais (auth, rest, storage, meta, studio, realtime)
#     ficam só na rede interna desta pilha, e o kong.yml oficial os encontra
#     pelos nomes de sempre.
#   * O banco entra na rede `easypanel` com o apelido
#     `supabase-sistema-mia-db`: é por ele que o `deskcomm` (outro projeto)
#     chega ao Postgres. Nenhuma porta é publicada no host.
#   * Sem analytics (logflare), vector, edge functions, imgproxy e supavisor.
#     O vector do outro Supabase consome ~47% de CPU da VPS sem parar; nada da
#     plataforma usa functions, transformação de imagem nem pooler (o app
#     conecta direto, pela rede interna).
#   * Dados em volumes NOMEADOS (não em ./volumes/db/data dentro do checkout
#     do git), e com sufixo escolhido por variável: o ensaio da migração usa
#     `-ensaio`, a virada usa o volume limpo. Trocar o sufixo é o jeito de
#     "apagar" o banco sem apagar nada: o volume velho fica, órfão, até alguém
#     remover de propósito.
#   * `migrador`: roda UMA vez por volume e copia a plataforma da nuvem para
#     cá, por dentro da VPS (sem abrir porta do banco). Ver migrador/migrar.sh.
# ═══════════════════════════════════════════════════════════════════════════

services:
  studio:
    image: supabase/studio:2026.04.27-sha-5f60601
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 3
    depends_on:
      meta:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: http://mia-kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - mia-studio-snippets:/app/snippets

  mia-kong:
    image: kong/kong:3.9.1
    restart: unless-stopped
    networks:
      default:
        aliases:
          - api-gw
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    configs:
      - source: kong_yml
        target: /home/kong/temp.yml
      - source: kong_entrypoint
        target: /home/kong/kong-entrypoint.sh
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: ["bash", "/home/kong/kong-entrypoint.sh"]

  auth:
    image: supabase/gotrue:v2.186.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      mia-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}

  rest:
    image: postgrest/postgrest:v14.8
    restart: unless-stopped
    depends_on:
      mia-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  realtime:
    image: supabase/realtime:v2.76.5
    restart: unless-stopped
    # O kong.yml oficial chama o realtime por este nome, e o realtime tira dele
    # o tenant (`realtime-dev`). O compose oficial resolve com container_name, que
    # o EasyPanel descarta; o apelido de rede faz o mesmo papel.
    networks:
      default:
        aliases:
          - realtime-dev.supabase-realtime
    depends_on:
      mia-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  storage:
    image: supabase/storage-api:v1.48.26
    restart: unless-stopped
    depends_on:
      mia-db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID}
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - mia-storage${MIA_VOLUME_SUFIXO:-}:/var/lib/storage

  meta:
    image: supabase/postgres-meta:v0.96.3
    restart: unless-stopped
    depends_on:
      mia-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  mia-db:
    image: supabase/postgres:17.6.1.084
    restart: unless-stopped
    networks:
      default: {}
      easypanel:
        aliases:
          - supabase-sistema-mia-db
    volumes:
      - mia-db-data${MIA_VOLUME_SUFIXO:-}:/var/lib/postgresql/data
      - mia-db-config${MIA_VOLUME_SUFIXO:-}:/etc/postgresql-custom
    configs:
      - source: db_realtime
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
      - source: db_webhooks
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
      - source: db_roles
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
      - source: db_jwt
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
      - source: db_supabase
        target: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
      - source: db_logs
        target: /docker-entrypoint-initdb.d/migrations/99-logs.sql
      - source: db_pooler
        target: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal"
      ]

  # Uma execução por volume: copia a plataforma da nuvem para cá. Desligado
  # com MIGRAR=off (o padrão). Ver migrador/migrar.sh para o que ele copia, a
  # ordem e por quê.
  migrador:
    image: supabase/postgres:17.6.1.084
    restart: "no"
    depends_on:
      mia-db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    entrypoint: ["bash", "/migrador/migrar.sh"]
    configs:
      - source: migrar_sh
        target: /migrador/migrar.sh
    environment:
      MIGRAR: ${MIGRAR:-off}
      NUVEM_DB_URL: ${NUVEM_DB_URL:-}
      NUVEM_URL_PUBLICO: ${NUVEM_URL_PUBLICO:-}
      NOVO_URL_PUBLICO: ${SUPABASE_PUBLIC_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}

networks:
  easypanel:
    external: true

volumes:
  mia-studio-snippets:
  mia-db-data:
  mia-db-config:
  mia-storage:
  mia-db-data-ensaio:
  mia-db-config-ensaio:
  mia-storage-ensaio:

configs:
  kong_yml:
    content: |
      _format_version: '2.1'
      _transform: true

      ###
      ### Consumers / Users
      ###
      consumers:
        - username: DASHBOARD
        - username: anon
          keyauth_credentials:
            - key: $$SUPABASE_ANON_KEY
            - key: $$SUPABASE_PUBLISHABLE_KEY
        - username: service_role
          keyauth_credentials:
            - key: $$SUPABASE_SERVICE_KEY
            - key: $$SUPABASE_SECRET_KEY

      ###
      ### Access Control List
      ###
      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      ###
      ### Dashboard credentials
      ###
      basicauth_credentials:
        - consumer: DASHBOARD
          username: '$$DASHBOARD_USERNAME'
          password: '$$DASHBOARD_PASSWORD'

      ###
      ### API Routes
      ###
      services:
        ## Open Auth routes
        - name: auth-v1-open
          _comment: 'Auth: /auth/v1/verify* -> http://auth:9999/verify*'
          url: http://auth:9999/verify
          routes:
            - name: auth-v1-open
              strip_path: true
              paths:
                - /auth/v1/verify
          plugins:
            - name: cors
        - name: auth-v1-open-callback
          _comment: 'Auth: /auth/v1/callback* -> http://auth:9999/callback*'
          url: http://auth:9999/callback
          routes:
            - name: auth-v1-open-callback
              strip_path: true
              paths:
                - /auth/v1/callback
          plugins:
            - name: cors
        - name: auth-v1-open-authorize
          _comment: 'Auth: /auth/v1/authorize* -> http://auth:9999/authorize*'
          url: http://auth:9999/authorize
          routes:
            - name: auth-v1-open-authorize
              strip_path: true
              paths:
                - /auth/v1/authorize
          plugins:
            - name: cors
        - name: auth-v1-open-jwks
          _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json'
          url: http://auth:9999/.well-known/jwks.json
          routes:
            - name: auth-v1-open-jwks
              strip_path: true
              paths:
                - /auth/v1/.well-known/jwks.json
          plugins:
            - name: cors

        - name: auth-v1-open-sso-acs
          url: "http://auth:9999/sso/saml/acs"
          routes:
            - name: auth-v1-open-sso-acs
              strip_path: true
              paths:
              - /sso/saml/acs
          plugins:
            - name: cors
            
        - name: auth-v1-open-sso-metadata
          url: "http://auth:9999/sso/saml/metadata"
          routes:
            - name: auth-v1-open-sso-metadata
              strip_path: true
              paths:
              - /sso/saml/metadata
          plugins:
            - name: cors

        ## Secure Auth routes
        - name: auth-v1
          _comment: 'Auth: /auth/v1/* -> http://auth:9999/*'
          url: http://auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths:
                - /auth/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure PostgREST routes
        - name: rest-v1
          _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
          url: http://rest:3000/
          routes:
            - name: rest-v1-all
              strip_path: true
              paths:
                - /rest/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure GraphQL routes
        - name: graphql-v1
          _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
          url: http://rest:3000/rpc/graphql
          routes:
            - name: graphql-v1-all
              strip_path: true
              paths:
                - /graphql/v1
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Content-Profile: graphql_public"
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure Realtime routes
        - name: realtime-v1-ws
          _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
          url: http://realtime-dev.supabase-realtime:4000/socket
          protocol: ws
          routes:
            - name: realtime-v1-ws
              strip_path: true
              paths:
                - /realtime/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "x-api-key:$$LUA_RT_WS_EXPR"
                replace:
                  querystring:
                    - "apikey:$$LUA_RT_WS_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        - name: realtime-v1-rest
          _comment: 'Realtime: /realtime/v1/api/* -> http://realtime:4000/api/*'
          url: http://realtime-dev.supabase-realtime:4000/api
          protocol: http
          routes:
            - name: realtime-v1-rest
              strip_path: true
              paths:
                - /realtime/v1/api
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Storage API endpoint (with Authorization header transformation).
        ## No key-auth — S3 protocol requests don't carry an apikey header.
        ##
        ## The request-transformer translates opaque API keys to asymmetric JWTs
        ## and passes through existing Authorization headers (user JWTs, AWS SigV4).
        ## When no Authorization or apikey header is present (S3 presigned URLs),
        ## the Lua expression evaluates to nil which Kong renders as empty string.
        ## The post-function strips this empty header so Storage's S3 signature
        ## verification falls through to query-parameter parsing.
        - name: storage-v1
          _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
          url: http://storage:5000/
          routes:
            - name: storage-v1-all
              strip_path: true
              paths:
                - /storage/v1/
          plugins:
            - name: cors
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: post-function
              config:
                access:
                  - |
                    local auth = kong.request.get_header("authorization")
                    if auth == nil or auth == "" or auth:find("^%s*$$") then
                      kong.service.request.clear_header("authorization")
                    end

        ## Edge Functions routes
        - name: functions-v1
          _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/*'
          url: http://functions:9000/
          read_timeout: 150000
          routes:
            - name: functions-v1-all
              strip_path: true
              paths:
                - /functions/v1/
          plugins:
            - name: cors

        ## OAuth 2.0 Authorization Server Metadata (RFC 8414)
        - name: well-known-oauth
          _comment: 'Auth: /.well-known/oauth-authorization-server -> http://auth:9999/.well-known/oauth-authorization-server'
          url: http://auth:9999/.well-known/oauth-authorization-server
          routes:
            - name: well-known-oauth
              strip_path: true
              paths:
                - /.well-known/oauth-authorization-server
          plugins:
            - name: cors

        ## Analytics routes
        ## Not used - Studio and Vector talk directly to analytics via Docker networking.
        ## If external access is needed, add routes with key-auth matching Logflare's x-api-key auth.
        # - name: analytics-v1-api
        #   _comment: 'Analytics: /analytics/v1/api/endpoints/* -> http://logflare:4000/api/endpoints/*'
        #   url: http://analytics:4000/api/endpoints
        #   routes:
        #     - name: analytics-v1-api
        #       strip_path: true
        #       paths:
        #         - /analytics/v1/api/endpoints/
        # - name: analytics-v1
        #   _comment: 'Analytics: /analytics/v1/* -> http://logflare:4000/*'
        #   url: http://analytics:4000/
        #   routes:
        #     - name: dashboard-v1-all
        #       strip_path: true
        #       paths:
        #         - /analytics/v1
        #   plugins:
        #     - name: cors
        #     - name: basic-auth
        #       config:
        #         hide_credentials: true

        ## Secure Database routes
        - name: meta
          _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
          url: http://meta:8080/
          routes:
            - name: meta-all
              strip_path: true
              paths:
                - /pg/
          plugins:
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin

        ## Block access to /api/mcp
        - name: mcp-blocker
          _comment: 'Block direct access to /api/mcp'
          url: http://studio:3000/api/mcp
          routes:
            - name: mcp-blocker-route
              strip_path: true
              paths:
                - /api/mcp
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        ## MCP endpoint - local access
        - name: mcp
          _comment: 'MCP: /mcp -> http://studio:3000/api/mcp (local access)'
          url: http://studio:3000/api/mcp
          routes:
            - name: mcp
              strip_path: true
              paths:
                - /mcp
          plugins:
            # Block access to /mcp by default
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."
            # Enable local access (danger zone!)
            # 1. Comment out the 'request-termination' section above
            # 2. Uncomment the entire section below, including 'deny'
            # 3. Add your local IPs to the 'allow' list
            #- name: cors
            #- name: ip-restriction
            #  config:
            #    allow:
            #      - 127.0.0.1
            #      - ::1
            #    deny: []

        ## Protected Dashboard - catch all remaining routes
        - name: dashboard
          _comment: 'Studio: /* -> http://studio:3000/*'
          url: http://studio:3000/
          routes:
            - name: dashboard-all
              strip_path: true
              paths:
                - /
          plugins:
            - name: cors
            - name: basic-auth
              config:
                hide_credentials: true

  kong_entrypoint:
    content: |
      #!/bin/bash
      # Custom entrypoint for Kong that builds Lua expressions for request-transformer
      # and performs environment variable substitution in the declarative config.

      # Build Lua expressions for translating opaque API keys to asymmetric JWTs.
      # When opaque keys are not configured (empty env vars), expressions fall through
      # to legacy-only behavior - just passing apikey as-is.
      #
      # Full expression logic (when opaque keys are configured):
      #   1. If Authorization header exists and is NOT an sb_ key -> pass through (user session JWT)
      #   2. If apikey matches secret key -> set service_role asymmetric JWT internal "API key"
      #   3. If apikey matches publishable key -> set anon asymmetric JWT internal "API key"
      #   4. Fallback: pass apikey as-is (legacy HS256 JWT)

      if [ -n "$$SUPABASE_SECRET_KEY" ] && [ -n "$$SUPABASE_PUBLISHABLE_KEY" ]; then
          # Opaque keys configured -> full translation expressions
          export LUA_AUTH_EXPR="\$$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$$SUPABASE_SECRET_KEY' and 'Bearer $$SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$$SUPABASE_PUBLISHABLE_KEY' and 'Bearer $$ANON_KEY_ASYMMETRIC') or headers.apikey)"

          # Realtime WebSocket: reads from query_params.apikey (supabase-js sends apikey
          # via query string), outputs to x-api-key header which Realtime checks first.
          export LUA_RT_WS_EXPR="\$$((query_params.apikey == '$$SUPABASE_SECRET_KEY' and '$$SERVICE_ROLE_KEY_ASYMMETRIC') or (query_params.apikey == '$$SUPABASE_PUBLISHABLE_KEY' and '$$ANON_KEY_ASYMMETRIC') or query_params.apikey)"
      else
          # Legacy API keys, not sb_ API keys -> pass apikey through unchanged
          export LUA_AUTH_EXPR="\$$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or headers.apikey)"
          export LUA_RT_WS_EXPR="\$$(query_params.apikey)"
      fi

      # Substitute environment variables in the Kong declarative config.
      # Uses awk instead of eval/echo to preserve YAML quoting (eval strips double
      # quotes, breaking "Header: value" patterns that YAML parses as mappings).
      awk '{
        result = ""
        rest = $$0
        while (match(rest, /\$$[A-Za-z_][A-Za-z_0-9]*/)) {
          varname = substr(rest, RSTART + 1, RLENGTH - 1)
          if (varname in ENVIRON) {
            result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
          } else {
            result = result substr(rest, 1, RSTART + RLENGTH - 1)
          }
          rest = substr(rest, RSTART + RLENGTH)
        }
        print result rest
      }' /home/kong/temp.yml > "$$KONG_DECLARATIVE_CONFIG"

      # Remove empty key-auth credentials (unconfigured opaque keys)
      sed -i '/^[[:space:]]*- key:[[:space:]]*$$/d' "$$KONG_DECLARATIVE_CONFIG"

      exec /entrypoint.sh kong docker-start

  db_realtime:
    content: |
      \set pguser `echo "$$POSTGRES_USER"`

      create schema if not exists _realtime;
      alter schema _realtime owner to :pguser;

  db_webhooks:
    content: |
      BEGIN;
        -- Create pg_net extension
        CREATE EXTENSION IF NOT EXISTS pg_net SCHEMA extensions;
        -- Create supabase_functions schema
        CREATE SCHEMA supabase_functions AUTHORIZATION supabase_admin;
        GRANT USAGE ON SCHEMA supabase_functions TO postgres, anon, authenticated, service_role;
        ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
        ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
        ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
        -- supabase_functions.migrations definition
        CREATE TABLE supabase_functions.migrations (
          version text PRIMARY KEY,
          inserted_at timestamptz NOT NULL DEFAULT NOW()
        );
        -- Initial supabase_functions migration
        INSERT INTO supabase_functions.migrations (version) VALUES ('initial');
        -- supabase_functions.hooks definition
        CREATE TABLE supabase_functions.hooks (
          id bigserial PRIMARY KEY,
          hook_table_id integer NOT NULL,
          hook_name text NOT NULL,
          created_at timestamptz NOT NULL DEFAULT NOW(),
          request_id bigint
        );
        CREATE INDEX supabase_functions_hooks_request_id_idx ON supabase_functions.hooks USING btree (request_id);
        CREATE INDEX supabase_functions_hooks_h_table_id_h_name_idx ON supabase_functions.hooks USING btree (hook_table_id, hook_name);
        COMMENT ON TABLE supabase_functions.hooks IS 'Supabase Functions Hooks: Audit trail for triggered hooks.';
        CREATE FUNCTION supabase_functions.http_request()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$function$$
          DECLARE
            request_id bigint;
            payload jsonb;
            url text := TG_ARGV[0]::text;
            method text := TG_ARGV[1]::text;
            headers jsonb DEFAULT '{}'::jsonb;
            params jsonb DEFAULT '{}'::jsonb;
            timeout_ms integer DEFAULT 1000;
          BEGIN
            IF url IS NULL OR url = 'null' THEN
              RAISE EXCEPTION 'url argument is missing';
            END IF;

            IF method IS NULL OR method = 'null' THEN
              RAISE EXCEPTION 'method argument is missing';
            END IF;

            IF TG_ARGV[2] IS NULL OR TG_ARGV[2] = 'null' THEN
              headers = '{"Content-Type": "application/json"}'::jsonb;
            ELSE
              headers = TG_ARGV[2]::jsonb;
            END IF;

            IF TG_ARGV[3] IS NULL OR TG_ARGV[3] = 'null' THEN
              params = '{}'::jsonb;
            ELSE
              params = TG_ARGV[3]::jsonb;
            END IF;

            IF TG_ARGV[4] IS NULL OR TG_ARGV[4] = 'null' THEN
              timeout_ms = 1000;
            ELSE
              timeout_ms = TG_ARGV[4]::integer;
            END IF;

            CASE
              WHEN method = 'GET' THEN
                SELECT http_get INTO request_id FROM net.http_get(
                  url,
                  params,
                  headers,
                  timeout_ms
                );
              WHEN method = 'POST' THEN
                payload = jsonb_build_object(
                  'old_record', OLD,
                  'record', NEW,
                  'type', TG_OP,
                  'table', TG_TABLE_NAME,
                  'schema', TG_TABLE_SCHEMA
                );

                SELECT http_post INTO request_id FROM net.http_post(
                  url,
                  payload,
                  params,
                  headers,
                  timeout_ms
                );
              ELSE
                RAISE EXCEPTION 'method argument % is invalid', method;
            END CASE;

            INSERT INTO supabase_functions.hooks
              (hook_table_id, hook_name, request_id)
            VALUES
              (TG_RELID, TG_NAME, request_id);

            RETURN NEW;
          END
        $$function$$;
        -- Supabase super admin
        DO
        $$$$
        BEGIN
          IF NOT EXISTS (
            SELECT 1
            FROM pg_roles
            WHERE rolname = 'supabase_functions_admin'
          )
          THEN
            CREATE USER supabase_functions_admin NOINHERIT CREATEROLE LOGIN NOREPLICATION;
          END IF;
        END
        $$$$;
        GRANT ALL PRIVILEGES ON SCHEMA supabase_functions TO supabase_functions_admin;
        GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA supabase_functions TO supabase_functions_admin;
        GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA supabase_functions TO supabase_functions_admin;
        ALTER USER supabase_functions_admin SET search_path = "supabase_functions";
        ALTER table "supabase_functions".migrations OWNER TO supabase_functions_admin;
        ALTER table "supabase_functions".hooks OWNER TO supabase_functions_admin;
        ALTER function "supabase_functions".http_request() OWNER TO supabase_functions_admin;
        GRANT supabase_functions_admin TO postgres;
        -- Remove unused supabase_pg_net_admin role
        DO
        $$$$
        BEGIN
          IF EXISTS (
            SELECT 1
            FROM pg_roles
            WHERE rolname = 'supabase_pg_net_admin'
          )
          THEN
            REASSIGN OWNED BY supabase_pg_net_admin TO supabase_admin;
            DROP OWNED BY supabase_pg_net_admin;
            DROP ROLE supabase_pg_net_admin;
          END IF;
        END
        $$$$;
        -- pg_net grants when extension is already enabled
        DO
        $$$$
        BEGIN
          IF EXISTS (
            SELECT 1
            FROM pg_extension
            WHERE extname = 'pg_net'
          )
          THEN
            GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
          END IF;
        END
        $$$$;
        -- Event trigger for pg_net
        CREATE OR REPLACE FUNCTION extensions.grant_pg_net_access()
        RETURNS event_trigger
        LANGUAGE plpgsql
        AS $$$$
        BEGIN
          IF EXISTS (
            SELECT 1
            FROM pg_event_trigger_ddl_commands() AS ev
            JOIN pg_extension AS ext
            ON ev.objid = ext.oid
            WHERE ext.extname = 'pg_net'
          )
          THEN
            GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
          END IF;
        END;
        $$$$;
        COMMENT ON FUNCTION extensions.grant_pg_net_access IS 'Grants access to pg_net';
        DO
        $$$$
        BEGIN
          IF NOT EXISTS (
            SELECT 1
            FROM pg_event_trigger
            WHERE evtname = 'issue_pg_net_access'
          ) THEN
            CREATE EVENT TRIGGER issue_pg_net_access ON ddl_command_end WHEN TAG IN ('CREATE EXTENSION')
            EXECUTE PROCEDURE extensions.grant_pg_net_access();
          END IF;
        END
        $$$$;
        INSERT INTO supabase_functions.migrations (version) VALUES ('20210809183423_update_grants');
        ALTER function supabase_functions.http_request() SECURITY DEFINER;
        ALTER function supabase_functions.http_request() SET search_path = supabase_functions;
        REVOKE ALL ON FUNCTION supabase_functions.http_request() FROM PUBLIC;
        GRANT EXECUTE ON FUNCTION supabase_functions.http_request() TO postgres, anon, authenticated, service_role;
      COMMIT;

