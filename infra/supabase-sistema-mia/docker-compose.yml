# ═══════════════════════════════════════════════════════════════════════════
# supabase-sistema-mia — o Supabase PRÓPRIO da plataforma MIA
#
# Serviço `supabase-sistema-mia` do projeto `banco-de-dados` no EasyPanel.
# Nasceu em 28/09/2026, quando o plano grátis do Supabase na nuvem estourou a
# cota de egress e restringiu o projeto (a plataforma ficou fora do ar).
#
# Base: o compose oficial do Supabase self-hosted, na MESMA versão que o
# template do EasyPanel instala (easypanel-io/compose @ 18-05-2026,
# supabase/code), com estas diferenças, cada uma com a sua razão:
#
#   * Postgres 17 (o override oficial docker-compose.pg17.yml). A plataforma
#     roda em 17.6 na nuvem; restaurar um dump do 17 num 15 não é suportado.
#   * `db`, `kong` e `auth` viram `mia-db`, `mia-kong` e `mia-auth`. Os três
#     são os únicos que entram na rede comum do EasyPanel (`easypanel`), onde
#     já vive o Supabase dos clientes do n8n com os MESMOS nomes de serviço.
#     Dois `db` na mesma rede = o DNS responde um OU outro, e um serviço de um
#     lado conecta no banco do outro. O `mia-auth` entra só para alcançar o
#     relay de e-mail `mia-smtp` do deskcomm, e guarda o nome `auth` como
#     apelido da rede interna. Os demais (rest, storage, meta, studio,
#     realtime) ficam só na rede interna desta pilha, e o kong.yml oficial os
#     encontra pelos nomes de sempre.
#   * O banco entra na rede `easypanel` com o apelido
#     `supabase-sistema-mia-db`: é por ele que o `deskcomm` (outro projeto)
#     chega ao Postgres. Nenhuma porta é publicada no host.
#   * Sem analytics (logflare), vector, edge functions, imgproxy e supavisor.
#     O vector do outro Supabase consome ~47% de CPU da VPS sem parar; nada da
#     plataforma usa functions, transformação de imagem nem pooler (o app
#     conecta direto, pela rede interna).
#   * Dados em volumes NOMEADOS (não em ./volumes/db/data dentro do checkout
#     do git), e com sufixo escolhido por variável: o ensaio da migração usa
#     `-ensaio`, a virada usa o volume limpo. Trocar o sufixo é o jeito de
#     "apagar" o banco sem apagar nada: o volume velho fica, órfão, até alguém
#     remover de propósito.
#   * `migrador`: roda UMA vez por volume e copia a plataforma da nuvem para
#     cá, por dentro da VPS (sem abrir porta do banco e sem a senha da nuvem
#     neste serviço). Ver migrador/migrar.sh.
#   * `backup` e `backup-envio`: cópia diária do banco e do Storage, levada
#     criptografada para um drive compartilhado do Google. Ver BACKUP.md.
# ═══════════════════════════════════════════════════════════════════════════

services:
  studio:
    image: supabase/studio:2026.04.27-sha-5f60601
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 3
    depends_on:
      meta:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: http://mia-kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - mia-studio-snippets:/app/snippets

  mia-kong:
    image: kong/kong:3.9.1
    restart: unless-stopped
    networks:
      default:
        aliases:
          - api-gw
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro,z
      - ./volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    # Pelo bash, e não direto: o bit de execução do script não sobrevive a todo
    # checkout (medido: "permission denied" no primeiro deploy, 28/09/2026).
    entrypoint: ["bash", "/home/kong/kong-entrypoint.sh"]

  # O GoTrue entra na rede `easypanel` por UM motivo: é por ela que ele alcança
  # o relay de e-mail `mia-smtp` ("esqueci a senha", confirmação de conta), que
  # mora no projeto deskcomm (docker-compose.easypanel.yml). Por isso o serviço
  # se chama `mia-auth`, e não `auth`: o compose registra o NOME DO SERVIÇO em
  # toda rede em que ele entra, e na `easypanel` já existe o `auth` do Supabase
  # dos clientes do n8n. Dois `auth` ali e o kong de uma pilha passa a mandar
  # login para o GoTrue da outra (o mesmo motivo do mia-db e do mia-kong).
  # O kong.yml oficial continua chamando `http://auth:9999`: `auth` agora é um
  # apelido SÓ na rede interna desta pilha. Medido em teste local (29/09/2026):
  # na rede `easypanel` o nome `auth` não resolve, `mia-auth` e `mia-smtp` sim;
  # na rede interna, `auth` resolve para este contêiner.
  #
  # SMTP (no Environment): SMTP_HOST=mia-smtp, SMTP_PORT=587, SMTP_USER e
  # SMTP_PASS vazios. O relay não oferece STARTTLS na rede interna de propósito:
  # o GoTrue v2.186 faz STARTTLS sozinho sempre que o servidor oferece e recusa o
  # certificado autoassinado ("x509: certificate is valid for localhost, not
  # mia-smtp", medido). Detalhes no bloco `mia-smtp` do compose do deskcomm.
  mia-auth:
    image: supabase/gotrue:v2.186.0
    restart: unless-stopped
    networks:
      default:
        aliases:
          - auth
      easypanel: {}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      mia-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}

  rest:
    image: postgrest/postgrest:v14.8
    restart: unless-stopped
    depends_on:
      mia-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  realtime:
    image: supabase/realtime:v2.76.5
    restart: unless-stopped
    # O kong.yml oficial chama o realtime por este nome, e o realtime tira dele
    # o tenant (`realtime-dev`). O compose oficial resolve com container_name, que
    # o EasyPanel descarta; o apelido de rede faz o mesmo papel.
    networks:
      default:
        aliases:
          - realtime-dev.supabase-realtime
    depends_on:
      mia-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  storage:
    image: supabase/storage-api:v1.48.26
    restart: unless-stopped
    depends_on:
      mia-db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID}
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - mia-storage${MIA_VOLUME_SUFIXO:-}:/var/lib/storage

  meta:
    image: supabase/postgres-meta:v0.96.3
    restart: unless-stopped
    depends_on:
      mia-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  mia-db:
    image: supabase/postgres:17.6.1.084
    restart: unless-stopped
    networks:
      default: {}
      easypanel:
        aliases:
          - supabase-sistema-mia-db
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      - ./volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      - ./volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      - mia-db-data${MIA_VOLUME_SUFIXO:-}:/var/lib/postgresql/data
      - mia-db-config${MIA_VOLUME_SUFIXO:-}:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal"
      ]

  # Uma execução por volume: copia a plataforma da nuvem para cá. Desligado
  # com MIGRAR=off (o padrão). Ver migrador/migrar.sh para o que ele copia, a
  # ordem e por quê.
  migrador:
    image: supabase/postgres:17.6.1.084
    restart: "no"
    depends_on:
      mia-db:
        condition: service_healthy
      mia-auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    entrypoint: ["bash", "/migrador/migrar.sh"]
    volumes:
      - ./migrador:/migrador:ro
    environment:
      MIGRAR: ${MIGRAR:-off}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      NUVEM_URL_PUBLICO: ${NUVEM_URL_PUBLICO:-}
      NOVO_URL_PUBLICO: ${SUPABASE_PUBLIC_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}

  # Backup diário, em dois serviços (ver BACKUP.md). O `backup` grava a cópia no
  # volume mia-backups; o `backup-envio` leva para o drive, criptografada. Dois, e
  # não um, porque cada imagem já traz a ferramenta certa: pg_dump da MESMA versão
  # do banco (a imagem do mia-db) e rclone (a imagem do rclone). E o que tem a
  # senha do banco não tem a credencial do Google, nem o contrário.
  # Nenhum dos dois entra na rede `easypanel`: um só fala com o mia-db, o outro
  # só com a internet.
  backup:
    image: supabase/postgres:17.6.1.084
    restart: unless-stopped
    depends_on:
      mia-db:
        condition: service_healthy
    entrypoint: ["bash", "/backup-scripts/fazer-backup.sh"]
    # A imagem traz o healthcheck do Postgres (pg_isready em localhost a cada 2 s),
    # que aqui nunca passa: não há banco neste contêiner (medido no 1º deploy,
    # 29/09/2026). O que o painel precisa mostrar é se o backup está em dia: há
    # cópia PRONTO de menos de 26 h (o diário das 06:00, as 3 tentativas e folga).
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 2 -name PRONTO -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 15m
    volumes:
      - ./backup:/backup-scripts:ro
      - mia-backups${MIA_VOLUME_SUFIXO:-}:/backups
      # Só leitura: o backup copia os arquivos do Storage, nunca escreve lá.
      - mia-storage${MIA_VOLUME_SUFIXO:-}:/storage:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_HORA_UTC: ${BACKUP_HORA_UTC:-06}
      BACKUP_MANTER_LOCAL: ${BACKUP_MANTER_LOCAL:-3}

  backup-envio:
    image: rclone/rclone:1.75.1
    restart: unless-stopped
    entrypoint: ["sh", "/backup-scripts/enviar.sh"]
    # No painel, "unhealthy" = o último relato do envio não é "ok" (credencial,
    # drive, senha) ou tem mais de 30 min (ele escreve um a cada volta de 10 min).
    healthcheck:
      test: ["CMD-SHELL", "find /backups/ENVIO-STATUS -mmin -30 | grep -q . && sed -n 2p /backups/ENVIO-STATUS | grep -q '^ok'"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 5m
    volumes:
      - ./backup:/backup-scripts:ro
      - mia-backups${MIA_VOLUME_SUFIXO:-}:/backups
    # Tudo com padrão vazio: sem credencial, o serviço sobe e fica parado
    # avisando (em operacao.backup_envio), em vez de derrubar o deploy da pilha.
    environment:
      GOOGLE_DRIVE_TOKEN_B64: ${GOOGLE_DRIVE_TOKEN_B64:-}
      GOOGLE_SA_JSON_B64: ${GOOGLE_SA_JSON_B64:-}
      BACKUP_DRIVE_ID: ${BACKUP_DRIVE_ID:-}
      BACKUP_CRIPTO_SENHA: ${BACKUP_CRIPTO_SENHA:-}
      BACKUP_CRIPTO_SAL: ${BACKUP_CRIPTO_SAL:-}
      BACKUP_MANTER_DIAS: ${BACKUP_MANTER_DIAS:-30}

networks:
  easypanel:
    external: true

volumes:
  mia-studio-snippets:
  mia-db-data:
  mia-db-config:
  mia-storage:
  mia-db-data-ensaio:
  mia-db-config-ensaio:
  mia-storage-ensaio:
  mia-backups:
  mia-backups-ensaio:
