# MIA no EasyPanel (serviço "Compose", fonte Git).
#
# Produto da Time Company, derivado do DeskcommCRM (MIT, Rafael Melgaço). O
# código do autor continua creditado no LICENSE; o que o cliente vê é MIA.
#
# Por que um compose próprio, e não o docker-compose.prod.yml:
#
#  1. O EasyPanel sobe sempre com `docker compose up --build -d`. O prod tem
#     `build:` no worker e no scheduler, então eles seriam COMPILADOS na VPS a
#     cada deploy. Aqui só existe `image:`: a VPS só baixa.
#  2. Não há instalador. O install.sh exige terminal na VPS; o serviço
#     `bootstrap` faz no banco o que ele fazia (extensões, schema, chave de
#     cifra e o dono) e roda de novo a cada deploy, como o update.sh.
#  3. Não há portas HTTP publicadas nem Let's Encrypt próprio. Quem publica e
#     emite o certificado é o Traefik do EasyPanel: o domínio aponta para o
#     serviço `caddy`, porta 80. O Caddy fica na frente do app só para manter as
#     regras do Caddyfile original (bloqueio do webhook global do WAHA e timeout
#     longo do runner do agente). Ver easypanel/Caddyfile. A ÚNICA porta
#     publicada no host é a UDP do áudio da chamada de voz (serviço `wacalls`),
#     porque áudio WebRTC não passa por proxy HTTP nenhum.
#
# Passo a passo no EasyPanel: easypanel/LEIA-ME.md.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Roda e SAI. O app e o worker só sobem depois que ele termina com sucesso:
  # schema pela metade é app sem RLS. No painel ele aparece parado, e é o certo.
  bootstrap:
    image: postgres:17-alpine
    restart: "no"
    env_file: .env
    entrypoint: ["sh", "/deskcomm/bootstrap.sh"]
    volumes:
      - ./supabase/baseline.sql:/deskcomm/baseline.sql:ro
      # O schema da MIA, aplicado depois do do upstream (easypanel/bootstrap.sh).
      - ./supabase/baseline-mia.sql:/deskcomm/baseline-mia.sql:ro
      - ./easypanel/bootstrap.sh:/deskcomm/bootstrap.sh:ro
    # Rede do EasyPanel: é por ela que chegamos ao Postgres da plataforma, o
    # serviço supabase-sistema-mia (projeto banco-de-dados), pelo apelido
    # supabase-sistema-mia-db. Só quem conecta no banco entra: bootstrap, app e
    # worker. O redis sem senha continua fora.
    networks:
      - default
      - easypanel
    logging: *default-logging

  app:
    mem_limit: 768m
    # Versão NUMERADA do build deste fork (tag git vX.Y.Z-tc.N → publish-image.yml),
    # nunca `latest`/`main`: pull_policy é `missing`, então tag móvel não seria
    # puxada de novo. Voltar ao autor: trocar o dono gabrielmket por melgarafael
    # e a tag por 1.21.0 (o endereço inteiro do autor não pode ser escrito aqui:
    # tests/unit/namespace-das-imagens.test.ts só o aceita nos arquivos âncora).
    image: ${APP_IMAGE:-ghcr.io/gabrielmket/mia-crm:1.21.0-mia.72}
    pull_policy: missing
    restart: unless-stopped
    env_file: .env
    environment:
      # A marca é da PLATAFORMA: a de cada empresa fica travada (não é apagada).
      # Valor fixo, sem `${}`: é decisão da MIA, não de quem edita o Environment.
      # Ver lib/branding/marca-da-organizacao-no-fork.ts.
      MARCA_DA_ORGANIZACAO: travada
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Rede do EasyPanel: é por ela que chegamos ao Postgres da plataforma, o
    # serviço supabase-sistema-mia (projeto banco-de-dados), pelo apelido
    # supabase-sistema-mia-db. Só quem conecta no banco entra: bootstrap, app e
    # worker. O redis sem senha continua fora.
    networks:
      - default
      - easypanel
    logging: *default-logging

  worker:
    mem_limit: 512m
    image: ${WORKER_IMAGE:-ghcr.io/gabrielmket/mia-worker:1.21.0-mia.72}
    pull_policy: missing
    restart: unless-stopped
    env_file: .env
    environment:
      WAHA_API_BASE_URL: http://waha:3000
      # Mesma trava do app: e-mail e aviso que o worker monta também leem a marca.
      MARCA_DA_ORGANIZACAO: travada
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Rede do EasyPanel: é por ela que chegamos ao Postgres da plataforma, o
    # serviço supabase-sistema-mia (projeto banco-de-dados), pelo apelido
    # supabase-sistema-mia-db. Só quem conecta no banco entra: bootstrap, app e
    # worker. O redis sem senha continua fora.
    networks:
      - default
      - easypanel
    logging: *default-logging

  # SEM `${VAR}` de segredo neste arquivo, em nenhum serviço. A checagem de
  # problemas do EasyPanel interpola o compose sem ler o `.env` (medido: acusa
  # "variable is not set" até para variável presente no Environment), então
  # segredo interpolado vira aviso no painel e, se o deploy fizer o mesmo,
  # string vazia no contêiner. Quem precisa de segredo lê pelo `env_file`.
  waha:
    mem_limit: 1280m
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    restart: unless-stopped
    # Traz WAHA_API_KEY em texto puro, o mesmo valor que o app manda no
    # X-Api-Key: o WAHA compara literal e confere. (O prod usa o hash com o
    # prefixo sha512:, que exigiria interpolar WAHA_API_KEY_SHA512.)
    # WHATSAPP_HOOK_HMAC fica de fora: o WAHA Core não assina o webhook mesmo
    # com ele (lib/waha/webhook-auth.ts), e o app aceita evento sem assinatura.
    env_file: .env
    environment:
      # Interno: o WAHA fala com o app pela rede do compose, nunca pela internet.
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    logging: *default-logging

  # ── Chamada de voz do WhatsApp (WaCalls, spec 18) ─────────────────────────
  #
  # ⚠️ O RISCO, antes de tudo: a chamada de voz vincula um SEGUNDO APARELHO ao
  # mesmo número que já atende, por um caminho que NÃO é o oficial do WhatsApp.
  # Quem pode ser bloqueada é a CONTA do número, não só o aparelho — e com ela
  # o canal onde o cliente vende. Por isso o contêiner no ar não liga nada
  # sozinho: cada organização precisa aceitar o risco na tela (Configurações ›
  # Segurança) e só então ler o QR em Conexões › Chamada de voz. Sem QR lido, o
  # WaCalls não fala com o WhatsApp de ninguém.
  #
  # ═══ POR QUE AQUI ELE SOBE SEMPRE, SEM O PROFILE `voz` DO PROD ═══
  #
  # No docker-compose.prod.yml o serviço vive no profile `voz`, desligado,
  # porque aquele arquivo é de TODA instalação self-host e serviço ligado por
  # padrão transformaria o risco acima em padrão. Este arquivo é de UMA
  # instalação só (a MIA, na VPS da Time Company), e a decisão de oferecer voz
  # já foi tomada (BACKLOG-MIA D1). Os interruptores que valem continuam de pé,
  # e são dois, os dois fora deste arquivo:
  #
  #   1. WACALLS_API_BASE_URL no Environment. Vazia, a tela mostra o aviso de
  #      "não configurada" e o worker desliga a ponte de eventos — é o
  #      interruptor da INSTALAÇÃO.
  #   2. O aceite por organização em Configurações › Segurança — o da CONTA.
  #
  # Manter o profile acrescentaria um terceiro interruptor que depende de o
  # deploy do EasyPanel ler COMPOSE_PROFILES do `.env`, e isso NUNCA foi medido
  # aqui (o que foi medido é o contrário: a checagem de problemas do painel
  # interpola sem ler o `.env`). Se ele não ler, o contêiner simplesmente não é
  # criado, a URL aponta para um nome que não resolve e o sintoma na tela é
  # "serviço fora do ar" — sem nada que diga que a causa é um profile. O custo
  # de subir sempre é pequeno e conhecido: um processo Go ocioso (teto de
  # 256 MiB) e uma porta UDP que descarta o que não vier de uma ligação aberta.
  #
  # ⚠️ `app` e `worker` NÃO ganham `depends_on: wacalls`, de propósito: voz fora
  # do ar não pode derrubar o CRM. Os dois já tratam o serviço ausente (banner
  # na tela, ponte do worker com backoff).
  #
  # ═══ A IMAGEM É A DO UPSTREAM, PINADA POR DIGEST ═══
  #
  # O mesmo digest do docker-compose.prod.yml (github.com/JotaDev66/WaCalls,
  # MIT): peça de terceiro se referencia, não se republica, e o registry dela
  # não tem `latest` (só `develop` e `sha-*`). Digest é imutável, então
  # `pull_policy: missing` basta. Ao trazer o upstream, conferir se o digest do
  # prod mudou e copiar o novo para cá.
  wacalls:
    mem_limit: 256m
    image: ${WACALLS_IMAGE:-ghcr.io/jotadev66/wacalls@sha256:9ff52ef9455cf42125a911c38bb8c855f0cc205516cada2054e5c05546909022}
    pull_policy: missing
    restart: unless-stopped
    # Segredos pelo `env_file`, pela regra do bloco do `waha`. O contêiner NÃO
    # SOBE sem WACALLS_ADMIN_USER e WACALLS_ADMIN_PASSWORD (exigência do
    # upstream: o build antigo não tinha autenticação nenhuma), e o app e o
    # worker só falam com ele pelo Bearer WACALLS_API_TOKEN — o mesmo valor, lido
    # do mesmo `.env` pelos três. WACALLS_PUBLIC_IP também vem daqui: é o IP
    # público da VPS, anunciado ao navegador como candidato ICE. Sem ele o
    # WaCalls anuncia o IP interno do contêiner (172.x), que navegador nenhum
    # alcança, e a ligação toca, conecta e fica MUDA.
    # (WACALLS_CORS_ORIGINS e WACALLS_TRUSTED_PROXIES ficam ausentes = vazios:
    # o navegador nunca fala com a API do WaCalls, tudo passa pelas rotas
    # /api/v1/voice/* do app.)
    env_file: .env
    environment:
      # A porta do áudio, FIXA. Sem ela o upstream cai em portas UDP efêmeras
      # aleatórias, impossíveis de publicar. Interpolada com padrão (não gera
      # aviso no painel) e com a MESMA expressão da linha de `ports:` — se o
      # deploy ler o `.env`, as duas mudam juntas; se não ler, as duas ficam em
      # 7881. Nunca descasam.
      WACALLS_WEBRTC_UDP_PORT: ${WACALLS_WEBRTC_UDP_PORT:-7881}
    ports:
      # Só UDP, e host == contêiner de PROPÓSITO: o número entra no candidato
      # SDP que o navegador recebe. Um remap (7881:7882) mandaria a mídia para
      # uma porta que o host não escuta. Precisa estar liberada também no
      # firewall do provedor da VPS (UDP de entrada).
      #
      # NUNCA a 8080 (TCP): é a API de administração do WaCalls, e ela fica só
      # na rede interna do compose, onde o app e o worker a alcançam como
      # http://wacalls:8080 (é esse o valor de WACALLS_API_BASE_URL).
      - "${WACALLS_WEBRTC_UDP_PORT:-7881}:${WACALLS_WEBRTC_UDP_PORT:-7881}/udp"
    volumes:
      # /data/wacalls.db guarda a credencial de sessão do WhatsApp, como o
      # waha-data. Apagar o volume desvincula todos os aparelhos (QR de novo).
      - wacalls-data:/data
    # Só na rede padrão do projeto, como o waha: não conecta no banco, então
    # não entra na rede `easypanel`. E há um motivo a mais, medido: o mux de
    # UDP escuta no IP da interface do contêiner (172.x:7881, não 0.0.0.0), e
    # com uma rede só não há dúvida de para qual IP o Docker entrega a porta.
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    # SRH_TOKEN vem do .env (é o mesmo valor de UPSTASH_REDIS_REST_TOKEN do app).
    env_file: .env
    environment:
      SRH_MODE: env
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/gabrielmket/mia-scheduler:1.21.0-mia.72}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # INTERNAL_SECRET vem do .env: sem ele os crons levam 401 em silêncio.
    env_file: .env
    environment:
      TZ: UTC
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./easypanel/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    # O caddy entra na rede do EasyPanel porque o Traefik dele o encontra lá.
    # O redis roda sem senha e fica fora dela, na rede padrão do projeto.
    networks:
      - default
      - easypanel
    logging: *default-logging

volumes:
  waha-data:
  waha-media:
  wacalls-data:
  caddy-data:
  caddy-config:

networks:
  easypanel:
    external: true
